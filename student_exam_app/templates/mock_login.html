<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026年云南省经济管理类专业技能考试</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(180deg, #0f6fae 0%, #1c85c4 38%, #4aa6d8 70%, #86c6e8 100%);
    overflow: hidden;
  }
  .cloud { position: absolute; background: rgba(255,255,255,.92); border-radius: 50%; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
  .k1 { width: 210px; height: 110px; left: 2%; top: 8%; }
  .k1::before { width: 120px; height: 120px; left: 40px; top: -46px; }
  .k1::after { width: 90px; height: 90px; left: 130px; top: -24px; }
  .k2 { width: 280px; height: 130px; right: -3%; top: 4%; opacity: .85; }
  .k2::before { width: 150px; height: 150px; left: 60px; top: -60px; }
  .k3 { width: 240px; height: 120px; left: -4%; bottom: 6%; opacity: .9; }
  .k3::before { width: 130px; height: 130px; left: 50px; top: -52px; }
  .k4 { width: 300px; height: 140px; right: 4%; bottom: 3%; opacity: .8; }
  .k4::before { width: 160px; height: 160px; left: 70px; top: -60px; }
  .k5 { width: 160px; height: 80px; left: 44%; top: 2%; opacity: .55; }
  .k5::before { width: 90px; height: 90px; left: 36px; top: -36px; }

  .wrap { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; }
  h1 {
    margin: 54px 0 40px; color: #fff; font-size: 38px; font-weight: 700; letter-spacing: 1px;
    text-shadow: 0 3px 8px rgba(0, 40, 80, .45); text-align: center;
  }
  .card { width: 640px; }
  .row { display: flex; align-items: center; margin-bottom: 20px; }
  .row > label {
    width: 118px; text-align: right; padding-right: 14px; color: #fff; font-size: 20px;
    letter-spacing: 1px; text-shadow: 0 1px 4px rgba(0,40,80,.45); flex-shrink: 0;
  }
  .row input[type=text], .row input[type=password] {
    width: 380px; height: 38px; border: 1px solid #9fb3c4; border-radius: 2px;
    padding: 0 9px; font-size: 15px; color: #334155; outline: none; background: #fff;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.08);
  }
  .row input:focus { border-color: #f0a500; box-shadow: 0 0 0 2px rgba(240,165,0,.3); }
  .cap { display: flex; align-items: center; gap: 10px; }
  .cap input { width: 250px; }
  .capimg {
    height: 38px; width: 118px; border: 1px solid #9fb3c4; border-radius: 2px; cursor: pointer;
    background: #eef7ff; display: flex; align-items: center; justify-content: center; gap: 3px;
    font-family: Georgia, serif; user-select: none; overflow: hidden;
  }
  .capimg span { font-size: 22px; font-weight: 700; font-style: italic; }
  .btnrow { padding-left: 118px; margin-top: 6px; }
  button.login {
    width: 96px; height: 38px; border: none; border-radius: 4px; cursor: pointer;
    color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 2px;
    background: linear-gradient(180deg, #ff7a4d 0%, #e33e18 100%);
    box-shadow: 0 2px 0 #9e2a0e, 0 4px 10px rgba(0,0,0,.25);
  }
  button.login:active { transform: translateY(1px); box-shadow: 0 1px 0 #9e2a0e; }
  .msg { width: 640px; margin-top: 14px; color: #ffe08a; font-size: 13px; min-height: 18px; text-align: center; }
  .note {
    width: 640px; margin-top: 18px; color: rgba(255,255,255,.86); font-size: 12px; line-height: 1.9;
    background: rgba(0,0,0,.12); border-radius: 6px; padding: 10px 14px;
  }
  .note b { color: #ffe08a; }
  .note a { color: #fff; }
</style>
</head>
<body>
  <div class="cloud k1"></div><div class="cloud k2"></div><div class="cloud k3"></div>
  <div class="cloud k4"></div><div class="cloud k5"></div>

  <div class="wrap">
    <h1>2026年云南省经济管理类专业技能考试</h1>
    <div class="card">
      <div class="row"><label>准考证号：</label><input id="exid" maxlength="20" placeholder="请输入准考证号"></div>
      <div class="row"><label>密码：</label><input id="pass" type="password" maxlength="24" placeholder="请输入身份证号"></div>
      <div class="row">
        <label>验证码：</label>
        <div class="cap">
          <input id="code" maxlength="6" placeholder="请输入右侧号码">
          <div class="capimg" id="cap" title="看不清？点一下换一张"></div>
        </div>
      </div>
      <div class="btnrow"><button class="login" id="btn">登 录</button></div>
      <div class="msg" id="msg"></div>
    </div>

    <div class="note">
      <div><b>模拟练习：</b>准考证号后加 <b>MN</b>、密码处填身份证号后加 <b>MN</b>，字母大写；验证码照右侧填写。</div>
      <div>例：准考证号 900190231 → 900190231MN；身份证 5322010219990619572X → 5322010219990619572XMN</div>
      <div><b>正式考试：</b>不加 MN，验证码由系统自动生成。</div>
      <div>本页仅用于熟悉登录流程，<b>不连接任何真实考试系统</b>，输入内容不会上传、不会被保存。练完去 <a href="/">在线练习</a> 做题。</div>
    </div>
  </div>

<script>
const $ = function (id) { return document.getElementById(id); };
let capText = '';

function makeCap() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXY23456789';
  capText = '';
  for (let i = 0; i < 4; i++) capText += chars[Math.floor(Math.random() * chars.length)];
  const box = $('cap');
  box.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const s = document.createElement('span');
    s.textContent = capText[i];
    s.style.color = ['#1a7f37', '#0b6ea8', '#c2410c', '#6d28d9'][i % 4];
    s.style.transform = 'rotate(' + (Math.random() * 24 - 12) + 'deg)';
    box.appendChild(s);
  }
}
makeCap();
$('cap').onclick = makeCap;

['exid', 'pass'].forEach(function (id) {
  $(id).addEventListener('input', function () { $(id).value = $(id).value.toUpperCase(); });
});

$('btn').onclick = function () {
  const msg = $('msg');
  msg.style.color = '#ffe08a';
  const a = $('exid').value.trim();
  const b = $('pass').value.trim();
  const c = $('code').value.trim().toUpperCase();
  if (!a) { msg.textContent = '请输入准考证号'; $('exid').focus(); return; }
  if (!b) { msg.textContent = '请输入密码'; $('pass').focus(); return; }
  if (!c) { msg.textContent = '请输入验证码'; $('code').focus(); return; }
  if (c !== capText) { msg.textContent = '验证码不正确，已换一张，请重新输入'; makeCap(); $('code').value = ''; $('code').focus(); return; }
  if (!/^\d{6,15}(MN)?$/.test(a)) { msg.textContent = '准考证号格式不对：应为数字，模拟考试再加 MN'; $('exid').focus(); return; }
  if (!/^\d{17}[\dX](MN)?$/.test(b)) { msg.textContent = '密码格式不对：应为 18 位身份证号（末位可为 X），模拟考试再加 MN'; $('pass').focus(); return; }
  if (a.endsWith('MN') !== b.endsWith('MN')) { msg.textContent = '准考证号与密码的 MN 状态不一致：模拟考试两个都加，正式考试两个都不加'; return; }
  msg.style.color = '#b9f6ca';
  msg.textContent = (a.endsWith('MN') ? '模拟考试' : '正式考试') + '登录成功，正在进入考试…';
  setTimeout(function () { location.href = '/mock/exam'; }, 900);
};
</script>
</body>
</html>
